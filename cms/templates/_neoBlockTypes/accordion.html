{##
 # NEO BLOCK TYPE: ACCORDION
 #}
<section class="c-block{% if sectionStyleClasses is defined and sectionStyleClasses != '' %} {{ sectionStyleClasses }}{% endif %}">
	<div class="container">
		<div class="row{% if block.paddingSides is defined and block.paddingSides == '1' %} justify-content-center{% endif %}">
			<div class="col-12{% if block.paddingSides is defined and block.paddingSides == '1' %} col-md-10 col-lg-8{% endif %}">
				{% include "_fields/headingBlock" with {'heading': block.headingBlock, 'class': 'mb-4'} %}
				{% if block.accordionItems | length %}
				<div class="c-accordion accordion" id="accordion-{{ block.id }}">
					{% for item in block.accordionItems %}
					<button id="heading-{{ item.id }}" class="c-accordion__toggle btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#accordion-item-{{ item.id }}" aria-expanded="{% if loop.first %}true{% else %}false{% endif %}" aria-controls="accordion-item-{{ item.id }}">
						{{ item.heading }}
					</button>
				
					<div id="accordion-item-{{ item.id }}" class="collapse{% if loop.first %} show{% endif %}" aria-labelledby="heading-{{ item.id }}" data-parent="#accordion-{{ block.id }}">
						<div class="c-accordion__content py-2 py-md-4">
							{{ item.description }}
						</div>
					</div>
					{% endfor %}
				</div>
				{% endif %}
			</div>
		</div>
	</div>
</section>
